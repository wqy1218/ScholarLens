<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ScholarLens">
  <!-- ScholarLens v8 static logo: bare magnifier (lens + glass highlight + handle),
       recentered on the frame and scaled 1.18 so it stays legible down to 16px.
       The in-app logo keeps the animated v6 orbit system; this file is the still
       mark used for docs and as the geometry source for assets/icon.ico. -->
  <defs>
    <linearGradient id="lg-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff" />
      <stop offset="1" stop-color="#4cc3e8" />
    </linearGradient>
    <radialGradient id="lg-glass" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="rgba(108,140,255,0.30)" />
      <stop offset="1" stop-color="rgba(108,140,255,0.04)" />
    </radialGradient>
  </defs>

  <g transform="translate(50 50) scale(1.18) translate(-47.5 -49.5)">
    <circle cx="42" cy="42" r="27" fill="url(#lg-glass)" stroke="url(#lg-stroke)" stroke-width="4" />
    <circle cx="33.5" cy="32.5" r="12" fill="rgba(255,255,255,0.08)" />
    <rect x="63" y="63" width="27" height="7" rx="3.5" transform="rotate(45 63 63)"
          fill="url(#lg-stroke)" />
  </g>
</svg>
